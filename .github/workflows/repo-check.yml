      - name: Verify AK68-798 SSH restore package
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import io
          import re
          import tarfile
          from pathlib import Path

          path = Path("40-server-web/mayebano-support/AK68-798-SSH-2222.nr")
          data = path.read_bytes()
          assert hashlib.sha256(data).hexdigest() == "970ee082b03762421d585b6538806b184bdce9d7a7ce6e8379915a3b32c727a1"
          assert data.startswith(b"\0name=- ")
          header, payload = data[1:].split(b"\n", 1)
          match = re.fullmatch(rb"name=- size=(\d+) crc=([0-9a-f]{32}) type=config", header)
          assert match
          assert int(match.group(1)) == len(payload)
          archive = gzip.decompress(payload)
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tar:
              members = tar.getmembers()
              assert [member.name for member in members] == ["etc/config/dropbear"]
              assert members[0].isfile()
              config = tar.extractfile(members[0]).read().decode("utf-8")
          assert config == """config dropbear
          \toption enable '1'
          \toption Interface 'lan'
          \toption Port '2222'
          \toption PasswordAuth 'on'
          \toption RootPasswordAuth 'on'
          \toption RootLogin '1'
          """
          PY

